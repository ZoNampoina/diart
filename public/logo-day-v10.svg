<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DI'ART">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".18" stop-color="#ffd96f"/>
      <stop offset=".46" stop-color="#e9a72f"/>
      <stop offset=".72" stop-color="#ffd96b"/>
      <stop offset="1" stop-color="#9d5f0d"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".28" stop-color="#ffd96a"/>
      <stop offset=".72" stop-color="#c67a12"/>
      <stop offset="1" stop-color="#7d4308"/>
    </linearGradient>
    <linearGradient id="inside" x1=".15" y1=".08" x2=".88" y2=".92">
      <stop offset="0" stop-color="#0647a5"/>
      <stop offset=".36" stop-color="#0b69d4"/>
      <stop offset=".70" stop-color="#08bfee"/>
      <stop offset="1" stop-color="#96f4ff"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4ba7"/><stop offset=".50" stop-color="#078ddd"/><stop offset="1" stop-color="#56eaff"/>
    </linearGradient>
    <radialGradient id="shine" cx=".35" cy=".16" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".60"/>
      <stop offset=".20" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#00121d" flood-opacity=".42"/>
    </filter>
    <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent canvas -->
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- D inner body -->
    <path d="M188 101H286C377 101 426 160 426 256C426 352 377 411 286 411H188Z"
          fill="url(#inside)" stroke="#08243d" stroke-width="7"/>

    <!-- subtle inner sheen -->
    <path d="M205 119H285C360 119 403 169 403 256C403 343 360 393 285 393H205Z"
          fill="url(#shine)" opacity=".55"/>

    <!-- golden D frame -->
    <path d="M181 86H290C394 86 451 151 451 256C451 361 394 426 290 426H181"
          fill="none" stroke="#704009" stroke-width="34"/>
    <path d="M181 86H290C394 86 451 151 451 256C451 361 394 426 290 426H181"
          fill="none" stroke="url(#gold)" stroke-width="27"/>
    <path d="M184 92H290C389 92 444 154 444 256C444 358 389 420 290 420H184"
          fill="none" stroke="#fff0ad" stroke-width="2.6" opacity=".92"/>

    <!-- open-book structure integrated into D -->
    <path d="M181 88C153 103 129 124 110 149V370C141 365 164 376 190 404V115C187 103 184 95 181 88Z"
          fill="url(#page)" stroke="#6f4008" stroke-width="13"/>
    <path d="M181 88C153 103 129 124 110 149V370C141 365 164 376 190 404V115C187 103 184 95 181 88Z"
          fill="none" stroke="url(#gold)" stroke-width="9"/>
    <path d="M172 118C150 132 136 147 124 165V351C145 350 162 358 181 375V139C179 130 176 123 172 118Z"
          fill="url(#page)" stroke="#fff0aa" stroke-width="2.4"/>

    <path d="M151 124C132 135 113 151 96 173V355C115 352 133 357 151 370Z"
          fill="url(#page)" stroke="#754208" stroke-width="12"/>
    <path d="M151 124C132 135 113 151 96 173V355C115 352 133 357 151 370Z"
          fill="none" stroke="url(#gold)" stroke-width="8"/>
    <path d="M145 148C130 158 117 169 107 182V337C120 337 132 340 145 348Z"
          fill="url(#page)" stroke="#fff2b1" stroke-width="2.2"/>

    <path d="M119 158C104 168 89 181 77 196V345C90 342 103 344 119 350Z"
          fill="url(#page)" stroke="#704009" stroke-width="11"/>
    <path d="M119 158C104 168 89 181 77 196V345C90 342 103 344 119 350Z"
          fill="none" stroke="url(#gold)" stroke-width="7"/>

    <!-- spine / hinge -->
    <path d="M190 113V405" fill="none" stroke="#74410a" stroke-width="14"/>
    <path d="M190 113V405" fill="none" stroke="url(#goldHi)" stroke-width="9"/>
    <path d="M194 117V401" fill="none" stroke="#fff1ad" stroke-width="2" opacity=".9"/>

    <!-- musical note -->
    <path d="M316 171V305C304 299 291 298 279 301C253 307 236 328 240 348C244 369 268 378 290 369C311 361 324 343 324 324V216L364 244V306C353 301 342 302 333 307C317 316 312 333 321 344C330 356 349 354 363 343C375 333 382 319 382 304V218C382 211 379 205 374 201L326 166C322 163 316 166 316 171Z"
          fill="#6f3f08" opacity=".85" transform="translate(4 5)"/>
    <path d="M312 166V300C300 294 287 293 275 296C249 302 232 323 236 343C240 364 264 373 286 364C307 356 320 338 320 319V211L360 239V301C349 296 338 297 329 302C313 311 308 328 317 339C326 351 345 349 359 338C371 328 378 314 378 299V213C378 206 375 200 370 196L322 161C318 158 312 161 312 166Z"
          fill="url(#gold)" stroke="#6e3f08" stroke-width="4"/>
    <path d="M318 174V298M326 171L367 201" fill="none" stroke="#fff2b6" stroke-width="2.4" opacity=".85"/>

    <!-- restrained cyan edge light -->
    <path d="M196 113H284C357 113 409 165 409 256C409 347 357 399 284 399H196"
          fill="none" stroke="#44eaff" stroke-width="3" opacity=".72" filter="url(#goldGlow)"/>
  </g>
</svg>